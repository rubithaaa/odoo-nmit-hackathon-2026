<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dfGradient1" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="dfGradient2" x1="10" y1="20" x2="30" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="dfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="40" height="40" rx="10" fill="#0F172A" />
  <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="#1E293B" />

  <!-- Flowing Paths (Employee -> Workday -> Growth) -->
  <path d="M10 28C10 28 14 12 20 12C26 12 30 28 30 28" stroke="url(#dfGradient1)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M14 20C16.5 16 23.5 16 26 20" stroke="url(#dfGradient2)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Growth Node -->
  <circle cx="20" cy="12" r="3" fill="#06B6D4" filter="url(#dfGlow)" />
  <circle cx="20" cy="12" r="1.5" fill="#FFFFFF" />
</svg>
